name: Release Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Automatically Extract Version from App
        id: version_extractor
        run: |
          echo "Fetching version directly from app/build.gradle.kts..."
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -n 1 | awk '{print $3}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.4.6"
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          echo "Detected Version Name: ${VERSION_NAME}"
          echo "Detected Version Code: ${VERSION_CODE}"
          echo "Release Tag: ${RELEASE_TAG}"
          echo "APP_VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Prepare Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Configuring release signing credentials..."
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding repository debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating standard debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          # Ensure keystore is present across root, app/ module, and keystore/ subfolder
          mkdir -p keystore app
          cp debug.keystore keystore/release.keystore
          cp debug.keystore app/debug.keystore
          echo "Keystore verified at root:"
          ls -lh debug.keystore app/debug.keystore keystore/release.keystore

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Locate and Package Release APK
        run: |
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find . -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find output/ -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_SRC" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found APK: $APK_SRC"
          cp "$APK_SRC" "dist/AeroPlayer-${{ env.RELEASE_TAG }}.apk"
          cd dist
          sha256sum "AeroPlayer-${{ env.RELEASE_TAG }}.apk" > "AeroPlayer-${{ env.RELEASE_TAG }}.apk.sha256"
          echo "Artifacts prepared:"
          ls -la

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AeroPlayer-${{ env.RELEASE_TAG }}
          path: dist/*
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Aero Player ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            ## 🍁 Aero Player ${{ env.RELEASE_TAG }}

            > **Made with 🍁 By Shubh jain**

            ### 🚀 Standalone Dual-Engine Video Player
            - **Google Media3 ExoPlayer Engine**: Low-latency hardware rendering, Dolby AC3/E-AC3 audio decoding, and HDR10+ support.
            - **Native LibVLC 3.6 Engine**: Built-in universal software codecs for MKV, FLV, WMV, VOB, TS, and live network streams (RTSP, RTMP, MMS, UDP).
            - **Dynamic Engine Switcher**: Toggle engines on-the-fly via the Aero Deck Pro Dashboard.

            ### ✨ Key Features
            - **Folder Management**: Real-time folder scanning, file counts, and storage badges.
            - **Fluid Pill Animations**: Spring-based collapsible left and right controls in portrait and landscape with smooth 180° chevron rotation.
            - **Unified Subtitle Engine**: Custom typography (Inter, Roboto, Monospace), outline, background opacity, and millisecond sync offset.
            - **Parametric Audio Suite**: 5-Band Equalizer, Bass Boost, and 3D Virtualizer.
            - **Intuitive Touch HUD**: Swipe left edge for Brightness, swipe right edge for Volume, horizontal scrub for Seek.
            - **Official Package**: `com.aerotech.aeroplayer`.

            ### 📦 Verification & Checksums
            Verify the integrity of downloaded artifacts with the attached `.sha256` checksum file.
          files: |
            dist/AeroPlayer-${{ env.RELEASE_TAG }}.apk
            dist/AeroPlayer-${{ env.RELEASE_TAG }}.apk.sha256
