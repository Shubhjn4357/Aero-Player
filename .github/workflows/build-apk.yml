name: Build Aero Player APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Assemble arm64-v8a Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare versioned APK artifact
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/AeroPlayer-v1.4.7-arm64-v8a-debug.apk
          ls -lh dist-apk/AeroPlayer-v1.4.7-arm64-v8a-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroPlayer-v1.4.7-arm64-v8a-debug-apk
          path: dist-apk/AeroPlayer-v1.4.7-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
