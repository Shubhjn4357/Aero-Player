name: Android Build and Release

on:
  push:
    branches:
      - main
      - gh-release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Calculate and Output APK Hashes
        id: hashes
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SHA1_DBG=$(sha1sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
            SHA256_DBG=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
            echo "sha1_debug=$SHA1_DBG" >> $GITHUB_OUTPUT
            echo "sha256_debug=$SHA256_DBG" >> $GITHUB_OUTPUT
            
            echo "========================================= DEBUG APK HASHES ========================================="
            echo "File: app-debug.apk"
            echo "SHA-1: $SHA1_DBG"
            echo "SHA-256: $SHA256_DBG"
            echo "===================================================================================================="
          fi
          
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SHA1_REL=$(sha1sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
            SHA256_REL=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
            echo "sha1_release=$SHA1_REL" >> $GITHUB_OUTPUT
            echo "sha256_release=$SHA256_REL" >> $GITHUB_OUTPUT
            
            echo "======================================== RELEASE APK HASHES ========================================"
            echo "File: app-release.apk"
            echo "SHA-1: $SHA1_REL"
            echo "SHA-256: $SHA256_REL"
            echo "===================================================================================================="
          fi

      - name: Add Hashes to GitHub Step Summary
        run: |
          echo "### 📱 APK Build Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | File Name | SHA-1 Hash | SHA-256 Hash |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "| **Debug** | \`app-debug.apk\` | \`${{ steps.hashes.outputs.sha1_debug }}\` | \`${{ steps.hashes.outputs.sha256_debug }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "| **Release** | \`app-release.apk\` | \`${{ steps.hashes.outputs.sha1_release }}\` | \`${{ steps.hashes.outputs.sha256_release }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rename APKs for Release
        run: |
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/app-release.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build-artifacts/*

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'gh-release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/app-debug.apk
            build-artifacts/app-release.apk
          name: "Release ${{ github.ref_name == 'gh-release' && 'from gh-release branch' || github.ref_name }}"
          body: |
            ## Automated Build Release
            
            ### 📱 APK Details & Cryptographic Hashes
            
            | Build Type | File | SHA-1 Hash | SHA-256 Hash |
            | --- | --- | --- | --- |
            | **Debug** | `app-debug.apk` | `${{ steps.hashes.outputs.sha1_debug }}` | `${{ steps.hashes.outputs.sha256_debug }}` |
            | **Release** | `app-release.apk` | `${{ steps.hashes.outputs.sha1_release }}` | `${{ steps.hashes.outputs.sha256_release }}` |
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
