<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110722"/>
      <stop offset="50%" stop-color="#1E0C3A"/>
      <stop offset="100%" stop-color="#2E1053"/>
    </linearGradient>

    <!-- Background Radial Ambient Glow -->
    <radialGradient id="glowGrad" cx="54" cy="54" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#7E22CE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>

    <!-- Trailing Wing Stroke Gradient -->
    <linearGradient id="wingGrad" x1="27" y1="37" x2="34" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8B4FE" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.13"/>
    </linearGradient>

    <!-- Main Aerodynamic Body Gradient -->
    <linearGradient id="arrowGrad" x1="35" y1="27" x2="79" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="25%" stop-color="#D8B4FE"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Top Facet Specular Highlight -->
    <linearGradient id="specularGrad" x1="35" y1="27" x2="78" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Core Accent -->
    <linearGradient id="coreGrad" x1="52" y1="48" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#D8B4FE" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Drop shadow for 3D elevation -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient glowing circle -->
  <circle cx="54" cy="54" r="42" fill="url(#glowGrad)" />

  <!-- Trailing aero wing accent -->
  <path d="M27,37 L34,42.5 L34,65.5 L27,71"
        fill="none"
        stroke="url(#wingGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Main aerodynamic arrow body with drop shadow -->
  <path d="M35,30 C35,27.5 38,26 40,27.5 L77,51.8 C79.2,53.2 79.2,54.8 77,56.2 L40,80.5 C38,82 35,80.5 35,78 L47,54 Z"
        fill="url(#arrowGrad)"
        filter="url(#shadow)" />

  <!-- Top facet specular highlight -->
  <path d="M40,27.5 L77,51.8 C77.8,52.4 78.1,53.2 78,54 L47,54 L35,30 C35,27.5 38,26 40,27.5 Z"
        fill="url(#specularGrad)" />

  <!-- Sleek inner arrow core accent -->
  <path d="M52,48 L60,54 L52,60"
        fill="none"
        stroke="url(#coreGrad)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>